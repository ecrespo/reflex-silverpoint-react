name: Code quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Ruff lint
        run: uv run --extra dev ruff check --output-format=github .
      - name: Ruff format
        run: uv run --extra dev ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --extra dev
      - name: Pytest
        run: uv run pytest -v

  agent:
    name: Agent catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: reflex-catalog.json is current (T-230)
        run: |
          uv run python scripts/export_catalog.py
          git diff --exit-code -- reflex-catalog.json
      - name: The reflex-silverpoint skill is current (T-246)
        run: uv run python scripts/make_skill.py --check

  build:
    name: Build and check distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Validate trove classifiers (PyPI rejects unknown ones)
        run: |
          uvx --python 3.12 --with trove-classifiers python -c "
          import tomllib, trove_classifiers as t
          bad = [c for c in tomllib.load(open('pyproject.toml', 'rb'))['project']['classifiers'] if c not in t.classifiers]
          assert not bad, f'Invalid classifiers: {bad}'
          "
      - name: Build sdist and wheel
        run: uv build
      - name: Twine check
        run: uv run --extra dev twine check --strict dist/*
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/python -c "import reflex_silverpoint_react as sp; assert len(sp.CHARTS) == 60; print(sp.SILVERPOINT_VERSION)"

  demo:
    name: Compile demo app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install
        # sp_timeline needs no Python extra since 0.7.1 (TimelineJS is an npm dependency).
        run: uv sync --locked
      - name: reflex compile
        working-directory: silverpoint_react_demo
        run: uv run reflex compile
