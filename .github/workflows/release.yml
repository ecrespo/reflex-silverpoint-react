name: Release

# Push a tag matching the version in pyproject.toml (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# PyPI upload uses Trusted Publishing (OIDC): no token is stored in the repository.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write

  build:
    name: Build distribution
    needs: [quality, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Check tag matches the package version
        run: |
          version=$(uv version --short)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - name: Twine check
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-silverpoint-react/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release with the distribution files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
