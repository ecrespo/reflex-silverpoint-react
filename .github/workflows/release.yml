name: Release

# Push a tag matching the version in pyproject.toml (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# PyPI upload uses Trusted Publishing (OIDC): no token is stored in the repository.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  # Run every JavaScript action on Node 24 (Node 20 is deprecated on GitHub runners).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write

  build:
    name: Build distribution
    needs: [quality, security]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Check tag matches the package version
        run: |
          version=$(uv version --short)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - name: Twine check
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      # The Reflex catalog (T-230) goes to the GitHub release only, not to PyPI.
      - name: Check the Reflex catalog matches the tagged code
        run: uv run python scripts/export_catalog.py --check
      - uses: actions/upload-artifact@v7
        with:
          name: catalog
          path: reflex-catalog.json
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-silverpoint-react/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: catalog
          path: catalog/
      - name: Create release with the distribution files and the Reflex catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* catalog/reflex-catalog.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
