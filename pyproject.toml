[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-silverpoint-react"
version = "0.2.0"
description = "The 33 silverpoint charts and the linked Dashboard (Renaissance silverpoint drawing style) for Reflex, wrapping @silverpoint/react"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = ["reflex", "reflex-custom-components", "charts", "silverpoint", "data-visualization", "svg"]

dependencies = ["reflex>=0.9.12"]

classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-silverpoint-react"
Source = "https://github.com/ecrespo/reflex-silverpoint-react"
Issues = "https://github.com/ecrespo/reflex-silverpoint-react/issues"
Upstream = "https://github.com/ecrespo/silverpoint"

[project.optional-dependencies]
dev = ["build", "twine", "pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.ruff]
line-length = 120
extend-exclude = ["silverpoint_react_demo/.web", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Reflex state vars are declared with mutable class-level defaults by design.
"silverpoint_react_demo/**/state.py" = ["RUF012"]
